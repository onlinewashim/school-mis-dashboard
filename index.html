<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School MIS Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            width: 180px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .school {
            color: #555;
        }
    </style>
</head>

<body>

    <h1>School MIS Dashboard</h1>

    <div class="dashboard">

        <div class="card">
            <div class="number">759</div>
            <div class="school">Total Schools</div>
        </div>

        <div class="card">
            <div class="number">85,000</div>
            <div class="school">Total Students</div>
        </div>

        <div class="card">
            <div class="number">43,500</div>
            <div class="school">Boys</div>
        </div>

        <div class="card">
            <div class="number">41,500</div>
            <div class="school">Girls</div>
        </div>

    </div>

</body>
</html>
